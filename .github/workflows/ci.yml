name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath -ldflags="-s -w" -o dist/ ./cmd/...
      # real login-service install on a throwaway machine: agent must come up on 47391
      - name: service install
        if: runner.os != 'Linux'
        shell: bash
        run: VIBETIME_SERVICE_TEST=1 VIBETIME_BIN="$PWD/dist/vibetime$([ "$RUNNER_OS" = Windows ] && echo .exe)" go test -run RealInstall -v ./internal/service
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test plugins/opencode/vibetime.test.ts plugins/pi/vibetime.test.ts
  browser:
    runs-on: ubuntu-24.04 # playwright 1.56 has no 26.04 build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: go build -o bin/ ./cmd/...
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: node --test e2e/console.test.mjs
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: VIBETIME_LOAD=1 go test -run LoadBudget -v ./internal/server
  linux-presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xprintidle xdotool
      - run: |
          Xvfb :99 -screen 0 1024x768x24 & sleep 1
          DISPLAY=:99 VIBETIME_PRESENCE_INPUT="xdotool mousemove 10 10 mousemove 200 200" go test -run 'SystemIdle' -v ./internal/presence
  wakatime-editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: |
          sudo apt-get install -y sqlite3 unzip
          curl -fsSL -o /tmp/w.zip https://github.com/wakatime/wakatime-cli/releases/download/v2.28.4/wakatime-cli-linux-amd64.zip
          unzip -q /tmp/w.zip -d /tmp/w && sudo mv /tmp/w/wakatime-cli-linux-amd64 /usr/local/bin/wakatime-cli
          wakatime-cli --version
      - run: ./e2e/wakatime.sh
