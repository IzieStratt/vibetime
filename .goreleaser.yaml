version: 2
builds:
  - id: vibetime
    main: ./cmd/vibetime
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64, "386"]
    ignore:
      - { goos: darwin, goarch: "386" }
  - id: vibetime-server
    main: ./cmd/vibetime-server
    binary: vibetime-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
archives:
  - id: agent
    ids: [vibetime]
    formats: [tar.gz]
    format_overrides: [{ goos: windows, formats: [zip] }]
    files: [LICENSE, README.md, plugins/**/*]
  - id: server
    ids: [vibetime-server]
    name_template: "vibetime-server_{{ .Os }}_{{ .Arch }}"
nfpms:
  - ids: [vibetime]
    package_name: vibetime
    license: AGPL-3.0-only
    maintainer: izie <238573415+IzieStratt@users.noreply.github.com>
    homepage: https://github.com/IzieStratt/vibetime
    description: Passive, privacy-friendly AI time tracking
    formats: [deb, rpm]
homebrew_casks:
  - name: vibetime
    ids: [agent]           # the agent archive (contains the `vibetime` binary + plugins)
    repository:
      owner: IzieStratt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://vs.izie.top/vibetime"
    description: "Passive, privacy-friendly AI time tracking"

checksum: { name_template: checksums.txt }
